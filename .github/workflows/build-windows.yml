name: build-windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Qt5-x64
            qt:   '5.15.0'
            arch: 'win64_msvc2019_64'
            msvc: 'x64'
          - name: Qt5-x86
            qt:   '5.15.0'
            arch: 'win32_msvc2019'
            msvc: 'x86'
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Checkout OpenRGB SDK (1.0rc3)
        run: git clone --depth 1 --branch release_candidate_1.0rc3 https://gitlab.com/CalcProgrammer1/OpenRGB.git OpenRGB

      - name: Install Qt ${{ matrix.qt }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          host: windows
          target: desktop
          arch: ${{ matrix.arch }}

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}

      - name: Build
        shell: cmd
        run: |
          qmake OpenRGBKeychronUltraPlugin.pro CONFIG+=release
          nmake

      - name: Collect DLL
        shell: cmd
        run: |
          if exist release\OpenRGBKeychronUltraPlugin.dll copy release\OpenRGBKeychronUltraPlugin.dll .
          dir /s /b *.dll

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGBKeychronUltraPlugin-${{ matrix.name }}
          path: |
            **/OpenRGBKeychronUltraPlugin.dll
          # A build that produced no DLL is a broken build. Warning here only
          # hides it until the release job fails with something less obvious.
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage DLLs with arch suffix
        run: |
          set -euo pipefail
          mkdir -p dist
          # Say which one is missing. Without this an empty find leaves the
          # variable blank and cp fails with a message that names neither the
          # architecture nor the reason.
          for arch in x64 x86; do
            dll="$(find artifacts -path "*Qt5-${arch}*" -name '*.dll' | head -1)"
            if [ -z "$dll" ]; then
              echo "No ${arch} DLL in the build artifacts. The ${arch} build did not produce one."
              find artifacts -type f | sed 's/^/  /'
              exit 1
            fi
            cp "$dll" "dist/OpenRGBKeychronUltraPlugin-${arch}.dll"
          done
          ls -l dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dll
          generate_release_notes: true
